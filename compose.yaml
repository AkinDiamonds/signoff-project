services:
  postgres:
    image: postgres:16-alpine
    container_name: signoff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: signoff
      POSTGRES_PASSWORD: signoff
      POSTGRES_DB: signoff
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signoff -d signoff"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
