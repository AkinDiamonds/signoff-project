[project]
name = "signoff"
version = "0.1.0"
description = "Signoff - Autonomous dispute agent for PayPal merchants constrained by charter limits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["signoff", "signoff/agent"]
testpaths = ["signoff/agent/tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["signoff"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.pyrefly]
search_path = ["signoff"]

[tool.pyright]
extraPaths = ["signoff"]

