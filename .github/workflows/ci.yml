name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Backend, frontend, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signoff
          POSTGRES_PASSWORD: signoff
          POSTGRES_DB: signoff_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SIGNOFF_TEST_DATABASE_URL: postgresql+psycopg://signoff:signoff@localhost:5432/signoff_test
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev
          mkdir -p .venv/Scripts
          ln -s ../bin/python .venv/Scripts/python.exe
          npm ci --no-audit --no-fund
      - name: Prepare disposable test database
        run: make prepare-test-db VENV_PY=.venv/Scripts/python.exe
      - name: Verify backend
        run: make test-agent VENV_PY=.venv/Scripts/python.exe
      - name: Verify frontend
        run: make test-web
      - name: Verify types and client freshness
        run: make test-types VENV_PY=.venv/Scripts/python.exe
      - name: Verify exported OpenAPI is current
        run: |
          make api-types VENV_PY=.venv/Scripts/python.exe
          git diff --exit-code -- signoff/packages/api-client/openapi.json signoff/packages/api-client/src/generated/schema.ts
      - name: Build both frontends
        run: npm run build
