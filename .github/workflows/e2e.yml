name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Cross-app smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install .[dev]
          npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start stack and run smoke
        run: |
          make e2e-stack
          make e2e-cross-smoke
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

  full:
    name: Cross-app full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install .[dev]
          npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start stack and run full suite
        run: make e2e
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full
          path: |
            playwright-report
            test-results
          retention-days: 7
